services:
  backend:
    build: ./backend
    ports:
      - "5000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/restaurant.db
      - UPLOAD_DIR=/app/uploads
      # Local development only. Generate a real secret for any deployed environment
      # and supply it from the host, not from this file.
      - JWT_SECRET=${JWT_SECRET:-dev-only-secret-do-not-use-in-production}
      - JWT_EXPIRES_IN=8h
    volumes:
      - ./backend:/app
      - /app/node_modules
      - sqlite-data:/app/data
      # Uploaded images must outlive the container for the same reason the database does.
      - menu-images:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  sqlite-data:
  menu-images:
